name: CityPulse Data Collection

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citypulse-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.1,<3.0" "requests>=2.31,<3.0"
      - name: Collect environmental snapshot and run scheduled alert monitor
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          CITYPULSE_STATE_DB: data/processed/scheduled_alert_state.sqlite3
          CITYPULSE_SCHEDULED_EMAIL_ENABLED: ${{ vars.CITYPULSE_SCHEDULED_EMAIL_ENABLED || 'false' }}
          CITYPULSE_ALERT_HEAT_C: ${{ vars.CITYPULSE_ALERT_HEAT_C }}
          CITYPULSE_ALERT_RAINFALL_MM: ${{ vars.CITYPULSE_ALERT_RAINFALL_MM }}
          CITYPULSE_ALERT_PM25_UG_M3: ${{ vars.CITYPULSE_ALERT_PM25_UG_M3 }}
          CITYPULSE_ALERT_PM10_UG_M3: ${{ vars.CITYPULSE_ALERT_PM10_UG_M3 }}
          CITYPULSE_SMTP_HOST: ${{ secrets.CITYPULSE_SMTP_HOST }}
          CITYPULSE_SMTP_PORT: ${{ secrets.CITYPULSE_SMTP_PORT }}
          CITYPULSE_SMTP_FROM: ${{ secrets.CITYPULSE_SMTP_FROM }}
          CITYPULSE_ALERT_EMAIL: ${{ secrets.CITYPULSE_ALERT_EMAIL }}
          CITYPULSE_SMTP_USERNAME: ${{ secrets.CITYPULSE_SMTP_USERNAME }}
          CITYPULSE_SMTP_PASSWORD: ${{ secrets.CITYPULSE_SMTP_PASSWORD }}
        run: python -m ingestion.snapshot
      - name: Commit new observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/raw/observations.csv ]; then
            git add data/raw/observations.csv
          fi
          if [ -f data/processed/daily_city_observations.csv.gz ]; then
            git add data/processed/daily_city_observations.csv.gz
          fi
          if [ -f data/processed/scheduled_alert_state.sqlite3 ]; then
            git add data/processed/scheduled_alert_state.sqlite3
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): collect environmental snapshot"
            git push
          else
            echo "No new observations to commit."
          fi
