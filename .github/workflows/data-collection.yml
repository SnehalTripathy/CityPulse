name: CityPulse Data Collection

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citypulse-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.1,<3.0" "requests>=2.31,<3.0"
      - name: Collect environmental snapshot
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python -m ingestion.snapshot
      - name: Commit new observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/raw/observations.csv ]; then
            git add data/raw/observations.csv
          fi
          if [ -f data/processed/daily_city_observations.csv ]; then
            git add data/processed/daily_city_observations.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): collect environmental snapshot"
            git push
          else
            echo "No new observations to commit."
          fi
